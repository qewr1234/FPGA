name: Q1 physical W4 mechanism replay offline checks
on:
  push:
    branches: [main]
    paths:
      - scripts/q1_physical_mechanism_replay.py
      - .github/workflows/q1_physical_mechanism_replay_check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Check syntax
        run: python -m py_compile scripts/q1_physical_mechanism_replay.py
      - name: Synthetic W4 cost and channel permutation checks, no board
        run: python scripts/q1_physical_mechanism_replay.py --selftest
