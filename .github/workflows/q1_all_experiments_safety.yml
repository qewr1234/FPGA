name: Q1 all-experiments launch safety checks
on:
  push:
    branches: [main]
    paths:
      - scripts/q1_all_experiments.py
      - scripts/test_q1_all_experiments.py
      - scripts/q1_fpga_triplet.py
      - RUN_Q1_ALL_EXPERIMENTS.cmd
      - .github/workflows/q1_all_experiments_safety.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax
        run: python -m py_compile scripts/q1_all_experiments.py scripts/q1_fpga_triplet.py scripts/test_q1_all_experiments.py
      - name: Validate plan never accesses board
        run: python scripts/q1_all_experiments.py --stage plan
      - name: Verify non-overwrite, strict physical reuse, status summaries
        run: python -m unittest discover -s scripts -p test_q1_all_experiments.py -v
