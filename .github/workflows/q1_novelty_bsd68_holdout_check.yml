name: Q1 joint vs marginal independent BSD68 holdout offline smoke
on:
  push:
    branches: [main]
    paths:
      - scripts/q1_novelty_bsd68_holdout.py
      - .github/workflows/q1_novelty_bsd68_holdout_check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4
      - name: Compile independent-image holdout gate
        run: python -m py_compile scripts/q1_novelty_bsd68_holdout.py
      - name: Test marginal histogram preservation and bank group capacity
        run: python scripts/q1_novelty_bsd68_holdout.py --selftest
